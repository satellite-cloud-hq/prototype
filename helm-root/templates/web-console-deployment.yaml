apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-console
  template:
    metadata:
      labels:
        app: web-console
    spec:
      containers:
        - name: web-console
          image: {{ .Values.webConsole.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.webConsole.port }}
          env:
            - name: CHOKIDAR_USEPOLLING
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: web-console
spec:
  type: NodePort
  selector:
    app: web-console
  ports:
    - name: http
      port: {{ .Values.webConsole.port }}
      targetPort: {{ .Values.webConsole.port }}
      nodePort: {{ .Values.webConsole.nodePort }}
