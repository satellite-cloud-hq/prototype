apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: {{ .Values.apiServer.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.apiServer.port }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
spec:
  # type: NodePort
  selector:
    app: api-server
  ports:
    - port: {{ .Values.apiServer.port }}
      targetPort: {{ .Values.apiServer.port }}
      # nodePort: {{ .Values.apiServer.nodePort }}
